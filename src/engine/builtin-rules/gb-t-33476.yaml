name: GB/T 33476-2016 党政机关公文格式
version: 1.0.0
description: 符合 GB/T 33476-2016《党政机关公文格式》国家标准的公文标准。
content:
  body:
    fonts:
      latinFamily: Times New Roman, serif
      cjkFamily: 仿宋_GB2312, FangSong, STFangsong, serif
      cnQuoteFamily: 仿宋_GB2312, FangSong, STFangsong, serif
      cnBookTitleFamily: 仿宋_GB2312, FangSong, STFangsong, serif
    style:
      size: 16pt
      weight: 400
      colors:
        text: '#000000'
        background: '#ffffff'
    paragraph:
      align: justify
      indent: 2em
      charsPerLine: 28
      spacing:
        lineHeight: 10.39mm
        before: 0lines
        after: 0lines
  h1:
    fonts:
      latinFamily: Times New Roman, serif
      cjkFamily: 方正小标宋_GBK, 方正小标宋简体, FZXiaoBiaoSong-B05, 黑体, SimHei, STHeiti, sans-serif
      cnQuoteFamily: 方正小标宋_GBK, 方正小标宋简体, FZXiaoBiaoSong-B05, 黑体, SimHei, STHeiti, sans-serif
      cnBookTitleFamily: 方正小标宋_GBK, 方正小标宋简体, FZXiaoBiaoSong-B05, 黑体, SimHei, STHeiti, sans-serif
    style:
      size: 22pt
      weight: 400
      colors:
        text: '#000000'
        background: '#ffffff'
      index:
    paragraph:
      align: center
      indent: 0em
      charsPerLine: 20
      spacing:
        lineHeight: 10.39mm
        before: 2lines
        after: 1lines
  h2:
    fonts:
      latinFamily: Times New Roman, serif
      cjkFamily: 黑体, SimHei, STHeiti, Microsoft YaHei, sans-serif
      cnQuoteFamily: 黑体, SimHei, STHeiti, Microsoft YaHei, sans-serif
      cnBookTitleFamily: 黑体, SimHei, STHeiti, Microsoft YaHei, sans-serif
    style:
      size: 16pt
      weight: 400
      colors:
        text: '#000000'
        background: '#ffffff'
      index: '{zhHansIndex}、'
    paragraph:
      align: left
      indent: 2em
      charsPerLine: 28
      spacing:
        lineHeight: 10.39mm
        before: 0lines
        after: 0lines
  h3:
    fonts:
      latinFamily: Times New Roman, serif
      cjkFamily: 楷体_GB2312, 楷体, KaiTi, KaiTi_GB2312, STKaiti, serif
      cnQuoteFamily: 楷体_GB2312, 楷体, KaiTi, KaiTi_GB2312, STKaiti, serif
      cnBookTitleFamily: 楷体_GB2312, 楷体, KaiTi, KaiTi_GB2312, STKaiti, serif
    style:
      size: 16pt
      weight: 400
      colors:
        text: '#000000'
        background: '#ffffff'
      index: '（{zhHansIndex}）'
    paragraph:
      align: left
      indent: 2em
      charsPerLine: 28
      spacing:
        lineHeight: 10.39mm
        before: 0lines
        after: 0lines
  h4:
    fonts:
      latinFamily: Times New Roman, serif
      cjkFamily: 仿宋_GB2312, 仿宋, FangSong, FangSong_GB2312, STFangsong, serif
      cnQuoteFamily: 仿宋_GB2312, 仿宋, FangSong, FangSong_GB2312, STFangsong, serif
      cnBookTitleFamily: 仿宋_GB2312, 仿宋, FangSong, FangSong_GB2312, STFangsong, serif
    style:
      size: 16pt
      weight: 400
      colors:
        text: '#000000'
        background: '#ffffff'
      index: '{arabicIndex}．'
    paragraph:
      align: left
      indent: 2em
      charsPerLine: 28
      spacing:
        lineHeight: 10.39mm
        before: 0lines
        after: 0lines
pagination:
  enabled: true
  format: '— {currentPage} —'
  numberStyle: arabic
  style:
    fonts:
      # GB/T 9704 §7.5：页码用 4 号半角宋体阿拉伯数字。latinFamily 与 cjkFamily 同置宋体，
      # 避免阿拉伯数字回落到 Times New Roman 等西文字体。
      latinFamily: 宋体, SimSun, STSong, serif
      cjkFamily: 宋体, SimSun, STSong, serif
    size: 14pt
    weight: 400
    colors:
      text: '#000000'
  position:
    vertical:
      anchor: bottom
      # GB/T 9704 §7.5：一字线上距版心下边缘 7mm。offset 为页码行盒底缘相对版心下边缘的
      # 下移量；行盒高 = 4号(14pt)×line-height:1 ≈ 4.94mm，底缘下移 10mm → 一字线上沿 ≈ 7mm。
      offset: 10mm
    horizontal:
      # 单页码居右空一字、双页码居左空一字，用 outside 锚点（奇页右、偶页左）；offset 14pt 即 4 号字一字宽，相对版心边缘起算
      anchor: outside
      offset: 14pt
page:
  size: A4
  orientation: portrait
  margins:
    top: 34.58mm
    right: 26mm
    bottom: 32.58mm
    left: 28mm
parser:
  html: false
  enterStyle: paragraph
  linkify: true
  typographer: true
  headingNumbering: true
  localStyleAliases:
    bodyParagraphIndent: content.body.paragraph.indent
    h1ParagraphIndent: content.h1.paragraph.indent
    h2ParagraphIndent: content.h2.paragraph.indent
    h3ParagraphIndent: content.h3.paragraph.indent
    h4ParagraphIndent: content.h4.paragraph.indent
  disabledSyntax:
    - codeBlock
    - blockquote
    - unorderedList
editor:
  fontSize: 18
  lineNumbers: true
  wordWrap: true
  tabSize: 2
preview:
  zoom: 100
autoSave:
  enabled: true
  interval: 30000
